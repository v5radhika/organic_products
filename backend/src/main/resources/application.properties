spring.application.name=venkatesha-organic-backend

# Database Configuration with environment variable support & fallback
spring.datasource.url=${DB_URL:jdbc:h2:mem:venkat_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA / Hibernate Configuration
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (enabled for quick inspection during dev)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Security / JWT Configuration
app.jwt.secret=${JWT_SECRET:9a4f2c8d7e1b5a3c9f8e7d6c5b4a3f2e1d0c9b8a7f6e5d4c3b2a1f0e9d8c7b6a}
app.jwt.expiration-ms=86400000

# OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.doc-expansion=none
springdoc.api-docs.path=/v3/api-docs

# Logging Configuration
logging.level.root=INFO
logging.level.com.venkatesha.organic=DEBUG
logging.level.org.springframework.security=INFO

# Data Initialization
spring.sql.init.mode=always
